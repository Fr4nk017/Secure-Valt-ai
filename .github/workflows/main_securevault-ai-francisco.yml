# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - securevault-ai-francisco

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://ttlpjjwkzygmgcyrbafv.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0bHBqandrenlnbWdjeXJiYWZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NTAyMDgsImV4cCI6MjEwNDAyNjIwOH0.4mAoeg5kcMcyWUnuvMXda0smctA1eAiybkFD8nv3qSw"
          NEXT_PUBLIC_APP_URL: "https://securevault-ai-francisco-dth5fndpbma0d2hy.brazilsouth-01.azurewebsites.net"
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E7F9C83DC64F40A293745AFCC4A254A5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1BA711820A6D449EAC6126AE322ABAE7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_19F61BBBF95C410E902117516AE5C8E4 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'securevault-ai-francisco'
          slot-name: 'Production'
          package: .