# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - securevault-ai-francisco

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://lbbxduncrgmffmrvdqtu.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxiYnhkdW5jcmdtZmZtcnZkcXR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwNDc2NjMsImV4cCI6MjA5MTYyMzY2M30.WlEn-9GPBQ07hGylgOtCk8amVO0hIAtFDPyzCiV_Gss"
          NEXT_PUBLIC_APP_URL: "https://securevault-ai-francisco-dth5fndpbma0d2hy.brazilsouth-01.azurewebsites.net"
          # Microsoft Entra ID (MSAL) — definir en Settings → Secrets and variables → Actions → Variables
          NEXT_PUBLIC_ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          NEXT_PUBLIC_ENTRA_CLIENT_ID: ${{ vars.ENTRA_SPA_CLIENT_ID }}
          NEXT_PUBLIC_ENTRA_API_SCOPE: ${{ vars.ENTRA_API_SCOPE }}
          NEXT_PUBLIC_BFF_BASE_URL: ${{ vars.BFF_BASE_URL || '/api/bff/v1' }}
        run: |
          npm ci
          npm run build
          npm run test

      # Paquete standalone (~70 MB): solo lo que el servidor necesita para correr.
      # Subir el proyecto completo (node_modules de desarrollo, ~760 MB) llena
      # el disco de 1 GB del plan F1 y el despliegue se cuelga.
      - name: Prepare standalone package
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          # Respaldo del cliente Prisma en una carpeta visible: el optimizador de
          # Azure (Oryx) puede omitir carpetas ocultas como node_modules/.prisma
          mkdir -p .next/standalone/prisma_generated/client
          cp -r node_modules/.prisma/client/. .next/standalone/prisma_generated/client/

      - name: Create deployment zip
        run: cd .next/standalone && zip -qr ../../node-app.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: node-app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E7F9C83DC64F40A293745AFCC4A254A5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1BA711820A6D449EAC6126AE322ABAE7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_19F61BBBF95C410E902117516AE5C8E4 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'securevault-ai-francisco'
          slot-name: 'Production'
          package: node-app.zip
          # Borra los archivos del despliegue anterior antes de copiar (sin esto
          # el despliegue es incremental y acumula archivos hasta llenar el disco)
          clean: true
          # Restaura el cliente Prisma si hiciera falta y arranca el servidor
          # standalone escuchando en todas las interfaces (Azure enruta al PORT)
          startup-command: 'mkdir -p node_modules/.prisma/client && cp -rn prisma_generated/client/. node_modules/.prisma/client/; HOSTNAME=0.0.0.0 node server.js'